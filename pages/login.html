<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Pastelaria da Marli</title>

    <!-- Caminhos relativos: funcionam abrindo o arquivo direto ou por servidor local -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="pagina-login">

    <main class="login">

        <!-- IDENTIDADE DA PASTELARIA -->
        <section class="login-marca">

            <div class="brand">
                <img
                    src="../img/Login.png"
                    alt="Logo da Pastelaria Teleférico da Marli"
                    class="logo"
                >
            </div>

            <h2>Pastelaria da Marli</h2>
            <p>Sistema de gerenciamento de pedidos</p>

        </section>

        <!-- FORMULÁRIO -->
        <section class="login-formulario">

            <header class="login-cabecalho">
                <h1>Bem-vindo(a)</h1>
                <p>Informe seus dados para acessar o sistema.</p>
            </header>

            <form id="form-login" novalidate>

                <div class="campo">

                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        aria-describedby="erro-usuario"
                    >

                    <span id="erro-usuario" class="mensagem-erro" role="alert"></span>

                </div>

                <div class="campo">

                    <label for="senha">Senha</label>

                    <div class="campo-senha">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            aria-describedby="erro-senha"
                        >

                        <button
                            type="button"
                            id="mostrar-senha"
                            class="botao-mostrar-senha"
                            aria-controls="senha"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>

                    </div>

                    <span id="erro-senha" class="mensagem-erro" role="alert"></span>

                </div>

                <!-- Mensagem geral do formulário (erro de login ou campos inválidos) -->
                <div id="mensagem-geral" class="mensagem-geral" hidden></div>

                <button type="submit" class="botao-adicionar botao-entrar">
                    Entrar
                </button>

                <p class="login-aviso">
                    Projeto acadêmico: o acesso é apenas uma demonstração e não oferece segurança real.
                </p>

            </form>

        </section>

    </main>

    <script src="../js/login.js"></script>

</body>
</html>
